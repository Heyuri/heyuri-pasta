[site]
name = Heyuri pasta
subtitle = Linguine
description = "Heyuri pasta is a tool you can use to share text - such as error logs, lists, links, and more. Uploads can be temporary or permanent."

[database]
database_name = pasta
database_user = pasta_user
database_password = pasta_password
database_host = localhost
database_port = 3306

[server]
url = "/"
home_url = "/"

[times_to_live]
5min = 300
30min = 1800
1hour = 3600
1day = 86400
3days = 259200
1week = 604800
1month = 2592000
permanent = 0

[moderation]
page_size = 50

[flood]
max_pastes = 5
window_seconds = 60

[paste]
min_length = 1
max_length = 4194303
title_max_length = 255